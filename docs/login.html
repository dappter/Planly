<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Planly</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="assets/icons/icon.svg" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      margin: 0;
      font-family: 'Telegraf', sans-serif;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .login-header p {
      color: #666;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      color: #666;
      font-size: 15px;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success-message {
      background: #efe;
      border: 1px solid #cfc;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 36px;
      }

      .btn-login {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <h1>PLAN<span style="color: #764ba2;">LY</span></h1>
      <p>Bem-vindo de volta!</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">
          <i class="fas fa-envelope"></i> E-mail
        </label>
        <input type="email" id="username" name="username" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label for="password">
          <i class="fas fa-lock"></i> Senha
        </label>
        <input type="password" id="password" name="password" placeholder="Sua senha" required>
      </div>

      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <div class="register-link">
      Não tem uma conta? <a href="register.html">Criar conta</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import {
      getAuth,
      signInWithEmailAndPassword
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "__FIREBASE_API_KEY__",
      authDomain: "meu-app-94c74.firebaseapp.com",
      projectId: "meu-app-94c74",
      storageBucket: "meu-app-94c74.firebasestorage.app",
      messagingSenderId: "711758646512",
      appId: "1:711758646512:web:d9dae94a6d47c8f89a4635",
      measurementId: "G-4BDC95W4VJ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      if (!email || !password) {
        errorMessage.textContent = '❌ Preencha e-mail e senha!';
        errorMessage.style.display = 'block';
        return;
      }

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        // Salvar ID do usuário no localStorage
        localStorage.setItem('planly_current_user', userCredential.user.uid);

        successMessage.textContent = '✅ Login realizado! Redirecionando...';
        successMessage.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1000);
      } catch (error) {
        console.error('Erro no login:', error);

        let errorMsg = '❌ Erro ao fazer login.';

        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorMsg = '❌ E-mail ou senha incorretos!';
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = '❌ E-mail inválido!';
        } else if (error.code === 'auth/too-many-requests') {
          errorMsg = '❌ Muitas tentativas. Aguarde alguns minutos.';
        }

        errorMessage.textContent = errorMsg;
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>

</html>
