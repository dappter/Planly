<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Planly</title>
  <link rel="stylesheet" href="assets/css/reset.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="assets/icons/icon.svg" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      margin: 0;
      font-family: 'Telegraf', sans-serif;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header h1 {
      font-size: 48px;
      color: #667eea;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .login-header p {
      color: #666;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
      color: #666;
      font-size: 15px;
    }

    .register-link a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: #fee;
      border: 1px solid #fcc;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .success-message {
      background: #efe;
      border: 1px solid #cfc;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      font-size: 14px;
    }

    .forgot-link {
      text-align: right;
      margin-top: -8px;
      margin-bottom: 20px;
    }

    .forgot-link a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* Modal Esqueci a Senha */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      transform: translateY(10px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      font-size: 22px;
      color: #333;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-close-modal {
      background: none;
      border: none;
      font-size: 28px;
      color: #888;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      transition: color 0.2s;
    }

    .btn-close-modal:hover {
      color: #333;
    }

    .modal-desc {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 36px;
      }

      .btn-login {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <h1>PLAN<span style="color: #764ba2;">LY</span></h1>
      <p>Bem-vindo de volta!</p>
    </div>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">
          <i class="fas fa-envelope"></i> E-mail
        </label>
        <input type="email" id="username" name="username" placeholder="seu@email.com" required>
      </div>

      <div class="form-group" style="margin-bottom: 12px;">
        <label for="password">
          <i class="fas fa-lock"></i> Senha
        </label>
        <input type="password" id="password" name="password" placeholder="Sua senha" required>
      </div>

      <div class="forgot-link">
        <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <div class="register-link">
      Não tem uma conta? <a href="register.html">Criar conta</a>
    </div>
  </div>

  <!-- Modal de Recuperação de Senha -->
  <div class="modal-overlay" id="forgotModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fas fa-key" style="color: #667eea;"></i> Recuperar Senha</h3>
        <button type="button" class="btn-close-modal" id="closeForgotModal" aria-label="Fechar">&times;</button>
      </div>
      <p class="modal-desc">Digite seu e-mail cadastrado. Enviaremos um link seguro para você redefinir sua senha.</p>
      
      <div class="error-message" id="forgotErrorMessage"></div>
      <div class="success-message" id="forgotSuccessMessage"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="forgotEmail"><i class="fas fa-envelope"></i> E-mail</label>
          <input type="email" id="forgotEmail" placeholder="seu@email.com" required>
        </div>
        <button type="submit" class="btn-login" id="btnSendForgot">
          <i class="fas fa-paper-plane"></i> Enviar Link de Recuperação
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { firebaseConfig } from './assets/js/firebase-config.js?v=5';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const btnLogin = document.getElementById('btnLogin');

    // Elementos do Modal Esqueci Senha
    const forgotLink = document.getElementById('forgotPasswordLink');
    const forgotModal = document.getElementById('forgotModal');
    const closeForgotModal = document.getElementById('closeForgotModal');
    const forgotForm = document.getElementById('forgotForm');
    const forgotEmailInput = document.getElementById('forgotEmail');
    const forgotErrorMessage = document.getElementById('forgotErrorMessage');
    const forgotSuccessMessage = document.getElementById('forgotSuccessMessage');
    const btnSendForgot = document.getElementById('btnSendForgot');

    // Abre modal de recuperação
    forgotLink.addEventListener('click', (e) => {
      e.preventDefault();
      forgotErrorMessage.style.display = 'none';
      forgotSuccessMessage.style.display = 'none';
      // Pré-preenche se o usuário já digitou o e-mail no login
      const currentEmail = document.getElementById('username').value.trim();
      if (currentEmail) {
        forgotEmailInput.value = currentEmail;
      }
      forgotModal.classList.add('active');
    });

    // Fecha modal
    closeForgotModal.addEventListener('click', () => {
      forgotModal.classList.remove('active');
    });

    // Fecha modal clicando fora do card
    forgotModal.addEventListener('click', (e) => {
      if (e.target === forgotModal) {
        forgotModal.classList.remove('active');
      }
    });

    // Enviar e-mail de recuperação
    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = forgotEmailInput.value.trim();

      forgotErrorMessage.style.display = 'none';
      forgotSuccessMessage.style.display = 'none';

      if (!email) {
        forgotErrorMessage.textContent = '❌ Por favor, digite seu e-mail.';
        forgotErrorMessage.style.display = 'block';
        return;
      }

      if (firebaseConfig.apiKey === '__FIREBASE_API_KEY__') {
        forgotErrorMessage.innerHTML = '⚠️ Chave do Firebase não carregada. Inicie com <code>INICIAR_SERVIDOR.bat</code>.';
        forgotErrorMessage.style.display = 'block';
        return;
      }

      btnSendForgot.disabled = true;
      btnSendForgot.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

      try {
        await sendPasswordResetEmail(auth, email);
        forgotSuccessMessage.innerHTML = '✅ Link enviado com sucesso! Verifique sua caixa de entrada e pasta de spam.';
        forgotSuccessMessage.style.display = 'block';
        forgotForm.reset();
      } catch (error) {
        console.error('Erro ao enviar e-mail de recuperação:', error);
        let msg = '❌ Erro ao enviar link de recuperação.';
        if (error.code === 'auth/user-not-found') {
          msg = '❌ Nenhum usuário cadastrado com este e-mail.';
        } else if (error.code === 'auth/invalid-email') {
          msg = '❌ Formato de e-mail inválido.';
        } else if (error.code === 'auth/too-many-requests') {
          msg = '❌ Muitas tentativas. Aguarde alguns minutos.';
        } else if (error.code === 'auth/operation-not-allowed') {
          msg = '❌ Provedor de E-mail não habilitado no Firebase Console.';
        } else {
          msg = `❌ Erro (${error.code || error.message || 'desconhecido'}).`;
        }
        forgotErrorMessage.textContent = msg;
        forgotErrorMessage.style.display = 'block';
      } finally {
        btnSendForgot.disabled = false;
        btnSendForgot.innerHTML = '<i class="fas fa-paper-plane"></i> Enviar Link de Recuperação';
      }
    });

    // Formulário de Login
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      if (!email || !password) {
        errorMessage.textContent = '❌ Preencha e-mail e senha!';
        errorMessage.style.display = 'block';
        return;
      }

      if (firebaseConfig.apiKey === '__FIREBASE_API_KEY__') {
        errorMessage.innerHTML = '⚠️ <strong>Chave do Firebase não carregada.</strong><br>Se estiver testando no seu computador, abra pelo script <code>INICIAR_SERVIDOR.bat</code> (ele injeta a chave local do .env).';
        errorMessage.style.display = 'block';
        return;
      }

      btnLogin.disabled = true;
      btnLogin.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);

        // Salvar ID do usuário no localStorage
        localStorage.setItem('planly_current_user', userCredential.user.uid);

        successMessage.textContent = '✅ Login realizado! Redirecionando...';
        successMessage.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (error) {
        console.error('Erro no login:', error);

        let errorMsg = '❌ Erro ao fazer login.';

        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          errorMsg = '❌ E-mail ou senha incorretos!';
        } else if (error.code === 'auth/invalid-email') {
          errorMsg = '❌ E-mail inválido!';
        } else if (error.code === 'auth/too-many-requests') {
          errorMsg = '❌ Muitas tentativas incorretas. Aguarde alguns minutos.';
        } else if (error.code === 'auth/operation-not-allowed') {
          errorMsg = '❌ O login por E-mail/Senha não está ativado no Firebase Console (Authentication > Sign-in method).';
        } else if (error.code === 'auth/api-key-not-valid' || error.code === 'auth/invalid-api-key') {
          errorMsg = '❌ Chave de API do Firebase inválida. Reinicie o servidor local ou confira a chave no .env.';
        } else if (error.code === 'auth/network-request-failed') {
          errorMsg = '❌ Falha de conexão. Verifique sua internet.';
        } else if (error.code === 'auth/user-disabled') {
          errorMsg = '❌ Esta conta foi desativada.';
        } else {
          errorMsg = `❌ Erro ao fazer login (${error.code || error.message || 'desconhecido'}).`;
        }

        errorMessage.textContent = errorMsg;
        errorMessage.style.display = 'block';
      } finally {
        btnLogin.disabled = false;
        btnLogin.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
      }
    });
  </script>
</body>

</html>
